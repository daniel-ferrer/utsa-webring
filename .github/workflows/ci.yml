name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Member data in a pull request is checked by the base branch's copy of the
      # validator, so a pull request can't loosen the rules that check it.
      - name: Check out base branch tooling
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add --detach "${RUNNER_TEMP}/base" "origin/${BASE_REF}"
          cp "${RUNNER_TEMP}/base/data/members.json" "${RUNNER_TEMP}/base-members.json"

      - name: Keep member changes separate from code changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if grep -qx 'data/members.json' <<< "$changed" && grep -qvx 'data/members.json' <<< "$changed"; then
            echo "::error::Pull requests that change data/members.json must not change other files. Please split them."
            exit 1
          fi

      - name: Validate members with the base branch's rules
        if: github.event_name == 'pull_request'
        run: node "${RUNNER_TEMP}/base/scripts/validate.mjs" --data data/members.json --base "${RUNNER_TEMP}/base-members.json"

      - name: Validate members
        if: github.event_name != 'pull_request'
        run: node scripts/validate.mjs

      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npm run lint:html

      # .pa11yci.json hides the loop diagram's SVG <text> from the check: axe can't
      # read SVG fill colors and reports that text as "needs review". Its contrast
      # is checked by hand (lowest pair: white on rosa, 4.74:1). Keep it that way
      # when changing colors in src/assets/css/site.css.
      - name: Accessibility check (sample data)
        run: |
          npm run build:sample
          node scripts/serve.mjs --port 8080 &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ > /dev/null && break; sleep 0.5; done
          npx --yes pa11y-ci@5.0.0 --config .pa11yci.json
          npm run build

      - name: Report on new or changed member sites
        if: github.event_name == 'pull_request'
        run: node "${RUNNER_TEMP}/base/scripts/check-new-sites.mjs" --data data/members.json --base "${RUNNER_TEMP}/base-members.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: dist/
          retention-days: 7
